<!DOCTYPE html>
<html>
<head>
    <title>Boat GPS Tracker</title>
    <script src="https://js.arcgis.com/4.34/"></script>
</head>
<body>

    <h1>Boat GPS Tracker</h1>

    <button id="signInButton">Sign In to ArcGIS</button>
    <p>ArcGIS: <span id="arcgisStatus">Not signed in</span></p>

    <button id="startButton">Start Tracking</button>
    <button id="stopButton">Stop Tracking</button>

    <p>Latitude: <span id="latitude">Not available</span></p>
    <p>Longitude: <span id="longitude">Not available</span></p>
    <p>Accuracy: <span id="accuracy">Not available</span> meters</p>
    <p>Status: <span id="status">Not tracking</span></p>
    <p>Time: <span id="time">Not available</span></p>

    <script>

        let watchID;
        let arcgisCredential;
        let tripID;
        let pathCoordinates = [];
        let pathObjectID = null;

        const portalURL = "https://www.arcgis.com";
        const clientID = "MpbbtiE8vXvj6by6";

        require([
            "esri/identity/OAuthInfo",
            "esri/identity/IdentityManager",
            "esri/layers/FeatureLayer",
            "esri/Graphic"
        ], function (OAuthInfo, esriId, FeatureLayer, Graphic) {

            const info = new OAuthInfo({
                appId: clientID,
                portalUrl: portalURL,
                popup: false
            });

            esriId.registerOAuthInfos([info]);

            const boatLayer = new FeatureLayer({
                url: "https://services1.arcgis.com/ug7Y0GY6kYE0tf0p/arcgis/rest/services/boat_gps/FeatureServer/0"
            });
            const pathLayer = new FeatureLayer({
                url: "https://services1.arcgis.com/ug7Y0GY6kYE0tf0p/arcgis/rest/services/boat_paths/FeatureServer/0"
            });

            // Check whether the user is already signed in
            esriId.checkSignInStatus(portalURL + "/sharing")
                .then(function (credential) {
                    arcgisCredential = credential;
                    document.getElementById("arcgisStatus").textContent = "Signed in";
                })
                .catch(function () {
                    // Not signed in yet
                });

            document.getElementById("signInButton").addEventListener("click", function () {
                esriId.getCredential(portalURL + "/sharing")
                    .then(function (credential) {
                        arcgisCredential = credential;
                        document.getElementById("arcgisStatus").textContent = "Signed in";
                        document.getElementById("signInButton").disabled = true;
                    })
                    .catch(function (error) {
                        console.error("Sign-in failed:", error);
                    });
            });

            function startTracking() {

                // Bug fix: don't start tracking if not signed in — otherwise
                // every applyEdits call below will silently fail.
                if (!arcgisCredential) {
                    document.getElementById("status").textContent =
                        "Please sign in to ArcGIS before tracking.";
                    return;
                }

                // Bug fix: check that the browser actually supports geolocation.
                if (!navigator.geolocation) {
                    document.getElementById("status").textContent =
                        "Geolocation is not supported by this browser.";
                    return;
                }

                document.getElementById("startButton").disabled = true;
                tripID = Date.now().toString();
                pathCoordinates = [];
                pathObjectID = null;
                document.getElementById("status").textContent = "Tracking...";

                watchID = navigator.geolocation.watchPosition(
                    locationSuccess,
                    locationError,
                    {
                        enableHighAccuracy: true
                    }
                );
            }

            function locationSuccess(position) {

                let latitude = position.coords.latitude;
                let longitude = position.coords.longitude;
                let accuracy = position.coords.accuracy;

                document.getElementById("latitude").textContent = latitude;
                document.getElementById("longitude").textContent = longitude;
                document.getElementById("accuracy").textContent = accuracy;
                document.getElementById("time").textContent = new Date().toLocaleTimeString();

                const point = {
                    type: "point",
                    longitude: longitude,
                    latitude: latitude,
                    spatialReference: {
                        wkid: 4326
                    }
                };

                const boatPosition = new Graphic({
                    geometry: point,
                    attributes: {
                        esrignss_fixdatetime: Date.now(),
                        esrignss_h_rms: accuracy,
                        trip_id: tripID
                    }
                });

                pathCoordinates.push([longitude, latitude]);

                console.log("Saving point with Trip ID:", tripID);

                boatLayer.applyEdits({
                    addFeatures: [boatPosition]
                })
                    .then(function (result) {
                        console.log("Location saved to ArcGIS:", result);
                    })
                    .catch(function (error) {
                        console.error("ArcGIS save failed:", error);
                    });

                if (pathCoordinates.length >= 2) {

                    const path = {
                        type: "polyline",
                        paths: [pathCoordinates],
                        spatialReference: {
                            wkid: 4326
                        }
                    };

                    if (pathObjectID === null) {

                        const newPath = new Graphic({
                            geometry: path,
                            attributes: {
                                trip_id: tripID
                            }
                        });

                        pathLayer.applyEdits({
                            addFeatures: [newPath]
                        })
                            .then(function (result) {
                                pathObjectID = result.addFeatureResults[0].objectId;
                                console.log("New path created:", pathObjectID);
                            })
                            .catch(function (error) {
                                console.error("Path creation failed:", error);
                            });

                    } else {

                        const updatedPath = new Graphic({
                            geometry: path,
                            attributes: {
                                OBJECTID: pathObjectID,
                                trip_id: tripID
                            }
                        });

                        pathLayer.applyEdits({
                            updateFeatures: [updatedPath]
                        })
                            .then(function (result) {
                                console.log("Path updated:", result);
                            })
                            .catch(function (error) {
                                console.error("Path update failed:", error);
                            });
                    }
                }
            }

            function locationError(error) {
                document.getElementById("status").textContent =
                    "Location error: " + error.message;
            }

            function stopTracking() {
                navigator.geolocation.clearWatch(watchID);
                document.getElementById("startButton").disabled = false;
                document.getElementById("status").textContent = "Tracking stopped";
            }

            document.getElementById("startButton").addEventListener("click", startTracking);
            document.getElementById("stopButton").addEventListener("click", stopTracking);

        });

    </script>

</body>
</html>
