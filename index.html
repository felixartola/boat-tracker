<!DOCTYPE html>
<html>
<head>
    <title>Boat GPS Tracker</title>
    <script src="https://js.arcgis.com/4.34/"></script>
</head>
<body>

    <h1>Boat GPS Tracker</h1>

    <button id="signInButton">Sign In to ArcGIS</button>
    <p>ArcGIS: <span id="arcgisStatus">Not signed in</span></p>

    <button id="startButton">Start Tracking</button>
    <button id="stopButton">Stop Tracking</button>

    <p>Latitude: <span id="latitude">Not available</span></p>
    <p>Longitude: <span id="longitude">Not available</span></p>
    <p>Accuracy: <span id="accuracy">Not available</span> meters</p>
    <p>Status: <span id="status">Not tracking</span></p>
    <p>Time: <span id="time">Not available</span></p>
    <p>Points saved: <span id="pointCount">0</span> | Path status: <span id="pathStatus">No path yet</span></p>

    <h3>Debug Log</h3>
    <div id="debugLog" style="border:1px solid #ccc; padding:8px; height:200px; overflow-y:auto; font-family:monospace; font-size:12px; white-space:pre-wrap; background:#f8f8f8;"></div>
    <button id="clearLogButton">Clear Log</button>

    <script>

        let watchID;
        let arcgisCredential;
        let tripID;
        let Coordinates = [];
        let ObjectID = null;
        let CreationInProgress = false; // guards against the race condition described below

        const portalURL = "https://www.arcgis.com";
        const clientID = "MpbbtiE8vXvj6by6";

        // Writes to both the browser console and an on-screen panel, since
        // iOS Safari has no easy way to view the console without a Mac.
        function logMessage(message, isError) {
            const logDiv = document.getElementById("debugLog");
            const time = new Date().toLocaleTimeString();
            const line = document.createElement("div");
            line.textContent = "[" + time + "] " + message;
            if (isError) {
                line.style.color = "red";
                console.error(message);
            } else {
                console.log(message);
            }
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        document.getElementById("clearLogButton").addEventListener("click", function () {
            document.getElementById("debugLog").innerHTML = "";
        });

        require([
            "esri/identity/OAuthInfo",
            "esri/identity/IdentityManager",
            "esri/layers/FeatureLayer",
            "esri/Graphic"
        ], function (OAuthInfo, esriId, FeatureLayer, Graphic) {

            const info = new OAuthInfo({
                appId: clientID,
                portalUrl: portalURL,
                popup: false
            });

            esriId.registerOAuthInfos([info]);

            const boatLayer = new FeatureLayer({
                url: "https://services1.arcgis.com/ug7Y0GY6kYE0tf0p/arcgis/rest/services/boat_gps/FeatureServer/0"
            });
            const Layer = new FeatureLayer({
                url: "https://services1.arcgis.com/ug7Y0GY6kYE0tf0p/arcgis/rest/services/boat_tracks/FeatureServer/0"
            });

            // Check whether the user is already signed in
            esriId.checkSignInStatus(portalURL + "/sharing")
                .then(function (credential) {
                    arcgisCredential = credential;
                    document.getElementById("arcgisStatus").textContent = "Signed in";
                })
                .catch(function () {
                    // Not signed in yet
                });

            document.getElementById("signInButton").addEventListener("click", function () {
                esriId.getCredential(portalURL + "/sharing")
                    .then(function (credential) {
                        arcgisCredential = credential;
                        document.getElementById("arcgisStatus").textContent = "Signed in";
                        document.getElementById("signInButton").disabled = true;
                    })
                    .catch(function (error) {
                        logMessage("Sign-in failed: " + error.message, true);
                    });
            });

            function startTracking() {

                // Bug fix: don't start tracking if not signed in — otherwise
                // every applyEdits call below will silently fail.
                if (!arcgisCredential) {
                    document.getElementById("status").textContent =
                        "Please sign in to ArcGIS before tracking.";
                    return;
                }

                // Bug fix: check that the browser actually supports geolocation.
                if (!navigator.geolocation) {
                    document.getElementById("status").textContent =
                        "Geolocation is not supported by this browser.";
                    return;
                }

                document.getElementById("startButton").disabled = true;
                tripID = Date.now().toString();
                Coordinates = [];
                ObjectID = null;
                document.getElementById("status").textContent = "Tracking...";

                watchID = navigator.geolocation.watchPosition(
                    locationSuccess,
                    locationError,
                    {
                        enableHighAccuracy: true
                    }
                );
            }

            function locationSuccess(position) {

                let latitude = position.coords.latitude;
                let longitude = position.coords.longitude;
                let accuracy = position.coords.accuracy;

                document.getElementById("latitude").textContent = latitude;
                document.getElementById("longitude").textContent = longitude;
                document.getElementById("accuracy").textContent = accuracy;
                document.getElementById("time").textContent = new Date().toLocaleTimeString();

                const point = {
                    type: "point",
                    longitude: longitude,
                    latitude: latitude,
                    spatialReference: {
                        wkid: 4326
                    }
                };

                const boatPosition = new Graphic({
                    geometry: point,
                    attributes: {
                        esrignss_fixdatetime: Date.now(),
                        esrignss_h_rms: accuracy,
                        trip_id: tripID
                    }
                });

                Coordinates.push([longitude, latitude]);

                logMessage("Attempting to save point #" + Coordinates.length + " (trip " + tripID + ")");

                boatLayer.applyEdits({
                    addFeatures: [boatPosition]
                })
                    .then(function (result) {
                        if (result.addFeatureResults[0].error) {
                            logMessage("Point save REJECTED by server: " +
                                JSON.stringify(result.addFeatureResults[0].error), true);
                        } else {
                            document.getElementById("pointCount").textContent = pathCoordinates.length;
                            logMessage("Point saved to boat_gps layer, OBJECTID " +
                                result.addFeatureResults[0].objectId);
                        }
                    })
                    .catch(function (error) {
                        logMessage("Point save request FAILED: " + error.message, true);
                    });

                if (pathCoordinates.length >= 2) {

                    const path = {
                        type: "polyline",
                        paths: [pathCoordinates],
                        spatialReference: {
                            wkid: 4326
                        }
                    };

                    if (pathObjectID === null) {

                        // Bug fix: without this guard, a second GPS fix that
                        // arrives before the first addFeatures call finishes
                        // sees pathObjectID still null and tries to create a
                        // SECOND path feature, causing duplicates or dropped
                        // updates. This flag makes later fixes wait.
                        if (pathCreationInProgress) {
                            logMessage("Path creation already in progress, skipping this fix.");
                            return;
                        }
                        pathCreationInProgress = true;

                        const newPath = new Graphic({
                            geometry: path,
                            attributes: {
                                trip_id: tripID
                            }
                        });

                        logMessage("Attempting to CREATE path feature (trip " + tripID + ")");

                        pathLayer.applyEdits({
                            addFeatures: [newPath]
                        })
                            .then(function (result) {
                                pathCreationInProgress = false;
                                const addResult = result.addFeatureResults[0];
                                if (addResult.error) {
                                    logMessage("Path CREATE rejected by server: " +
                                        JSON.stringify(addResult.error), true);
                                    document.getElementById("pathStatus").textContent = "Create failed";
                                } else {
                                    pathObjectID = addResult.objectId;
                                    logMessage("Path created, OBJECTID " + pathObjectID);
                                    document.getElementById("pathStatus").textContent =
                                        "Created (OBJECTID " + pathObjectID + ")";
                                }
                            })
                            .catch(function (error) {
                                pathCreationInProgress = false;
                                logMessage("Path CREATE request failed: " + error.message, true);
                                document.getElementById("pathStatus").textContent = "Create failed";
                            });

                    } else {

                        const updatedPath = new Graphic({
                            geometry: path,
                            attributes: {
                                OBJECTID: pathObjectID,
                                trip_id: tripID
                            }
                        });

                        pathLayer.applyEdits({
                            updateFeatures: [updatedPath]
                        })
                            .then(function (result) {
                                const updateResult = result.updateFeatureResults[0];
                                if (updateResult.error) {
                                    logMessage("Path UPDATE rejected by server: " +
                                        JSON.stringify(updateResult.error), true);
                                    document.getElementById("pathStatus").textContent = "Update failed";
                                } else {
                                    logMessage("Path updated, OBJECTID " + pathObjectID +
                                        " (" + pathCoordinates.length + " points)");
                                    document.getElementById("pathStatus").textContent =
                                        "Updated (" + pathCoordinates.length + " points)";
                                }
                            })
                            .catch(function (error) {
                                logMessage("Path UPDATE request failed: " + error.message, true);
                                document.getElementById("pathStatus").textContent = "Update failed";
                            });
                    }
                }
            }

            function locationError(error) {
                document.getElementById("status").textContent =
                    "Location error: " + error.message;
                logMessage("Geolocation error: " + error.message, true);
            }

            function stopTracking() {
                navigator.geolocation.clearWatch(watchID);
                document.getElementById("startButton").disabled = false;
                document.getElementById("status").textContent = "Tracking stopped";
            }

            document.getElementById("startButton").addEventListener("click", startTracking);
            document.getElementById("stopButton").addEventListener("click", stopTracking);

        });

    </script>

</body>
</html>
